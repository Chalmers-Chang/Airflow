[project]
name = "airflow"
version = "0.1.0"
description = "Airflow DAGs and local Docker deployment (Python 3.8 / Airflow 2.10.5)"
requires-python = ">=3.8.1,<3.9"
dependencies = [
    "apache-airflow==2.10.5",
    "cryptography",
    "google-auth",
    "google-cloud-bigquery",
    "numpy",
    "pandas",
    "pymysql",
    "pyodbc",
    "slack-sdk",
]

[tool.uv]
package = false
# Official Airflow 2.10.5 + Python 3.8 constraints:
# https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.8.txt
